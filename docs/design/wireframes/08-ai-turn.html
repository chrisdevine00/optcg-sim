<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board: AI turn</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="wf.css">
</head>
<body class="board-page">
<main class="stage" aria-label="Game: Rocks.D.Xebec (you) vs Kaido (Pirate AI)"></main>
<div id="announce-polite" class="sr-only" role="status" aria-live="polite">Kaido plays Queen, cost 9, resting 9 DON!!.</div>
<style>.recap{padding:6px 8px;border:1px solid var(--color-line-strong);border-radius:6px;margin-bottom:6px;font-size:12px;line-height:16px}</style>
<script src="wf.js"></script>
<script src="cards.js"></script>
<script src="scenarios.js"></script>
<script>
const STATES = [['acting', 'AI move: highlight + dwell'], ['thinking', 'Thinking (real wait)'], ['skipped', 'After skip: recap']];
WF.mountBoard((st) => {
  const opp = (id, x = {}) => K(id, { who: 'Opponent’s', ...x });
  // One speed control everywhere (board.md §5.3, C11): Step is a pace on the same scale
  const speed = (cur = '1×') => `<div class="row" style="gap:8px;margin-top:8px"><span class="lbl" style="margin:0">Speed</span>
      <div class="seg" role="radiogroup" aria-label="Opponent speed">${['Step', '0.5×', '1×', '2×', '4×'].map((v) => `<button type="button" role="radio" aria-checked="${v === cur}">${v}</button>`).join('')}</div></div>
      <p class="subtle" style="margin:6px 0 0;font-size:12px">Pause <kbd>K</kbd> · slower / faster <kbd>[</kbd> <kbd>]</kbd></p>`;
  const s = {
    boardLabel: 'Game board, turn 8, opponent’s turn',
    opp: {
      idText: 'Kaido · Pirate AI', hand: 4, donDeck: 0, active: 1, rested: 9, life: 3, deck: 28,
      leader: opp('OP17-058'),
      trash: { n: 5, top: K('OP15-078') },
      chars: [null, opp('EB04-031'), null, opp('OP17-060'), null],
    },
    me: {
      donDeck: 3, active: 2, rested: 5, life: 4, deck: 28,
      leader: K('OP17-039', { who: 'Your', don: 0 }),
      trash: { n: 7, top: K('OP17-056') },
      chars: [null, K('OP17-044', { r: true }), K('OP17-048', { r: true }), K('OP17-054'), null],
      hand: [K('OP17-046', { hand: true }), K('OP08-051', { hand: true }), K('OP17-045', { hand: true }), K('OP17-049', { hand: true }), K('OP17-055', { hand: true })],
    },
    mid: { turn: 'Turn 8 · Opponent’s turn', phase: 'Main', opp: true },
    log: [
      SCN.th('Turn 7 · You'),
      SCN.you(`${SCN.lk('Shiki')} attacks ${SCN.lk('King')} · 9000 vs 7000`),
      SCN.opp(`Block: ${SCN.lk('Yamato')} · 1000`),
      '<li>Yamato K.O.’d · King safe</li>',
      SCN.you('End of turn · 2 active DON!!'),
      SCN.th('Turn 8 · Opp'),
      SCN.opp('Refresh · Draw · DON!! +2 · 10 DON!!', false),
    ],
    coachStrip: { why: 'ready', whyCls: 'ready', tempo: 'frozen' },
  };
  const o = s.opp;
  if (st === 'acting') {
    o.chars[2] = opp('OP17-065', { st: ['opp-act'], chips: [{ t: 'playing', cls: 'opp' }] });
    o.status = 'Playing';
    s.mid.left = 'played Queen';
    s.log.push(SCN.opp(`Play ${SCN.lk('Queen')} · 9 DON!!`));
    s.decision = {
      title: 'Kaido’s turn · move 2',
      q: true,
      // Narration names the actor of each clause (UX-R22); the printed text stays in the preview
      body: `<p style="margin:0 0 4px"><b>Kaido plays Queen.</b> On Play, DON!! −1: Kaido draws 1. Your Stussy and Captain John can’t attack until the end of your next turn.</p>${speed()}`,
      foot: `<button class="btn" type="button" data-key="K" aria-label="Pause (K)">❚❚ Pause <kbd>K</kbd></button>${SCN.primary('Skip to my decision', 'stops when you have a choice', 'S')}`,
    };
  }
  if (st === 'thinking') {
    o.status = 'Thinking';
    s.mid.left = '<span aria-hidden="true">◔</span> Opponent is thinking…';
    s.decision = {
      title: 'Kaido’s turn',
      body: `<p style="margin:0" role="status"><b>Kaido is thinking…</b></p>
        <div class="indet" style="margin:6px 0 4px" aria-hidden="true"></div>${speed()}`,
      foot: `<button class="btn" type="button" data-key="K">❚❚ Pause <kbd>K</kbd></button>${SCN.primary('Skip to my decision', 'stops when you have a choice', 'S')}`,
    };
  }
  if (st === 'skipped') {
    // Skip finished the queued moves and STOPPED at the first decision you owe (UX-R3, board.md §5.3).
    s.boardLabel = 'Game board, turn 8, opponent’s turn, you are defending';
    s.decisionTall = true;
    o.chars[2] = opp('OP17-065', { chips: [{ t: 'New', cls: 'opp' }] });
    o.leader = opp('OP17-058', { r: true, don: 2, p: 7000, st: ['opp-act', 'battle'], chips: [{ t: '⚔ attacking', cls: 'attack', pos: 'below' }], noRestChip: true });
    o.active = 0; o.rested = 8; o.donDeck = 0;
    s.me.chars[3] = K('OP17-054', { chips: [{ t: 'Can’t attack', cls: 'warning' }] });
    s.me.chars[1] = K('OP17-044', { r: true, chips: [{ t: 'Can’t attack', cls: 'warning', pos: 'below' }] });
    s.me.leader.st = ['battle'];
    const [glo, buck, kyo, lin, auth] = s.me.hand;
    [buck, auth].forEach((c) => { c.st = ['legal']; c.g = 'play'; });
    [glo, kyo, lin].forEach((c) => { c.st = ['dim']; });
    s.mid = { turn: 'Turn 8 · Opponent’s turn', opp: true, battle: 'Block', left: '' };
    s.arrows = [{ from: 'opp.leader', to: 'me.leader', cut: 40 }];
    s.log.push(
      '<li class="skipped"><span class="chip opp">Opp</span>Play Queen · 9 DON!!</li>',
      '<li class="skipped">On Play: Kaido draws 1 · your Stussy and Captain John can’t attack</li>',
      '<li class="skipped"><span class="chip opp">Opp</span>Give 2 DON!! to Kaido · 7000</li>',
      SCN.opp(`${SCN.lk('Kaido')} attacks your Leader · 7000 vs 5000`),
    );
    s.decision = {
      title: 'Defend your Leader · Kaido attacks',
      body: `<div class="recap" role="status"><b>Stopped: Kaido attacks your Leader (7000 vs 5000). Your decision.</b><br><span class="muted">While you skipped: Kaido played Queen (your Stussy and Captain John can’t attack until the end of your next turn) and gave 2 DON!! to Kaido.</span></div>`
        + SCN.battle({ att: { name: 'Kaido <span class="subtle">(their Leader)</span>', num: '7000', bd: '5000 + 2000 DON!!' }, def: { name: 'Your Leader', num: '5000', bd: 'no counters staged · 2 in hand, up to +3000' }, res: { cls: 'hit', text: 'Hit lands', need: 'Need +3000' },
          post: `<div class="lane"><span class="ln">Block</span><div class="opts"><span class="muted">No Blocker on your field</span></div></div>
            <div class="lane" style="border-bottom:0"><span class="ln">Counter</span><div class="opts"><button class="opt" type="button" aria-pressed="false">Buckin +1000</button><button class="opt" type="button" aria-pressed="false">No Authority +2000 <span class="subtle" style="font-weight:500">· 1 DON!!</span></button></div></div>
            <p class="subtle" style="margin:4px 0 0;font-size:12px">Both together make +3000: exactly enough. Click lit hand cards to stage.</p>` }),
      foot: `${SCN.secondary('Counter', 'stage a lit hand card', '', 'aria-disabled="true"')}${SCN.primary('Take the hit', 'Life 4 → 3 · +1 card', '')}`,
    };
  }
  return s;
}, STATES);
</script>
</body>
</html>

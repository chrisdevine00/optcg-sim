<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game review: overview</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="wf.css">
<style>
  /* Review Overview (learning-ui §4.1, C21): timeline, flag list, explanation, a text-free thumbnail. No text under 12 px. */
  body { overflow: hidden; }
  .rv { height: 100vh; display: grid; grid-template-rows: 56px auto auto minmax(0, 1fr) auto; }
  .rv-title { display: flex; align-items: center; gap: 12px; padding: 6px 24px 0; flex-wrap: wrap; }
  .rv-title h1 { font: 600 var(--text-2xl)/var(--leading-2xl) var(--font-display); margin: 0; }
  .tl { margin: 6px 24px 0; border: 1px solid var(--color-line); border-radius: var(--radius-3); background: var(--color-surface-1); padding: 4px 8px; }
  .tl-grid { display: grid; grid-template-columns: 152px repeat(14, minmax(0, 1fr)); align-items: center; }
  .tl-grid .h { font: 600 12px/16px var(--font-ui); color: var(--color-text-muted); text-align: center; white-space: nowrap; }
  .tl-grid .h.mine { color: var(--color-text); }
  .tl-grid .h.cur { color: var(--color-accent-text); }
  .tl-grid .rl { font: 600 12px/16px var(--font-ui); color: var(--color-text-muted); }
  .cell { height: 34px; display: flex; align-items: center; justify-content: center; gap: 3px; border-left: 1px solid var(--color-line); }
  .cell.mine { background: rgb(108 196 255 / 0.05); }
  .cell.hatch { background: repeating-linear-gradient(135deg, var(--color-line) 0 2px, transparent 2px 7px); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--color-accent); border-radius: 4px; }
  .flag { min-width: 24px; height: 28px; border: 0; background: transparent; padding: 0 2px; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; color: var(--color-text); border-radius: 4px; font: 700 12px/1 var(--font-ui); text-decoration: none; }
  .flag svg { display: block; flex: none; }
  /* Severity is size plus a word, never colour alone (learning-ui §4.2, UX-R30) */
  .flag.sev svg { width: 20px; height: 20px; }
  .flag.mod svg { width: 16px; height: 16px; }
  .flag.min svg { width: 12px; height: 12px; }
  .flag[aria-current='true'] { background: var(--color-accent); color: var(--color-on-accent); }
  .why-mk { font: 600 12px/16px var(--font-ui); color: var(--color-opponent-text); }
  .legend { display: flex; gap: 12px; font-size: 12px; line-height: 16px; color: var(--color-text-muted); align-items: center; flex-wrap: wrap; margin: 2px 0 0 152px; }
  .legend svg { width: 12px; height: 12px; vertical-align: -2px; }
  .rv-main { display: grid; grid-template-columns: 288px minmax(0, 1fr) 256px; gap: 12px; padding: 8px 24px 8px; min-height: 0; }
  .roomy-h .rv-main { grid-template-columns: 360px minmax(0, 1fr) 380px; gap: 16px; }
  .col { background: var(--color-surface-1); border: 1px solid var(--color-line); border-radius: var(--radius-3); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .col > header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--color-line); flex: none; }
  .col > header h2 { font: 600 var(--text-sm)/18px var(--font-ui); margin: 0; flex: 1; }
  .flist { list-style: none; margin: 0; padding: 4px; overflow: auto; flex: 1; }
  .flist a { display: grid; grid-template-columns: 26px 1fr; gap: 2px 6px; padding: 5px 6px; border-radius: 6px; text-decoration: none; color: var(--color-text); font-size: var(--text-sm); line-height: 18px; }
  .flist a[aria-current='true'] { background: var(--color-surface-3); box-shadow: inset 3px 0 0 var(--color-accent); }
  .flist a:hover { background: var(--color-surface-2); }
  .flist .ic { grid-row: 1 / 3; display: grid; place-items: center; }
  .flist .meta { font-size: 12px; line-height: 16px; color: var(--color-text-muted); }
  .flist .sevw { font-weight: 700; color: var(--color-text); }
  .detail .rbody { padding: 10px 14px; overflow: auto; flex: 1; min-height: 0; }
  .detail .wyd { padding: 6px 10px; border-radius: 6px; background: var(--color-surface-2); border: 1px solid var(--color-line); margin: 0 0 10px; }
  .detail .claim { font-size: var(--text-xl); line-height: var(--leading-xl); }
  /* Actions are pinned and never scroll away (UX-R29) */
  .dfoot2 { flex: none; display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--color-line); flex-wrap: wrap; background: var(--color-surface-1); }
  .thumbcol .tbody { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .thumbbox { position: relative; overflow: hidden; border: 1px solid var(--color-line); border-radius: 6px; background: var(--color-mat); }
  .thumbbox .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* Text-free thumbnail: shapes and positions only, so nothing on it is ever small text (UX-R5) */
  .thumb .b, .thumb .plate, .thumb .cchip, .thumb .zlabel, .thumb .face .nm, .thumb .al, .thumb .ini, .thumb .midline, .thumb .oppid, .thumb .opphand .cnt, .thumb .dl, .thumb .dplate, .thumb .glyph, .thumb .turnbar { visibility: hidden; }
  .thumb .tok { font-size: 0; }
  .thumb svg text { display: none; }
  .sortbar { display: inline-flex; gap: 2px; }
  .sortbar button { height: 24px; border: 1px solid var(--color-line-strong); background: transparent; border-radius: 4px; font: 600 12px/1 var(--font-ui); color: var(--color-text-muted); padding: 0 6px; cursor: pointer; }
  .sortbar button[aria-pressed='true'] { background: var(--color-surface-3); color: var(--color-text); }
</style>
</head>
<body>
<div class="rv">
  <header class="app-header"></header>
  <div class="rv-title" id="title"></div>
  <section class="tl" aria-label="Turn timeline"><div id="tl"></div></section>
  <div class="rv-main">
    <section class="col" aria-labelledby="flh"><header><h2 id="flh">Flags</h2><span class="sortbar" role="group" aria-label="Sort flags"><button type="button" aria-pressed="true">Turn</button><button type="button" aria-pressed="false">Severity</button></span></header>
      <ol class="flist" id="flist" aria-label="Flags. Up and Down move; Enter studies the moment."></ol></section>
    <article class="col detail" id="detail" aria-label="Selected flag"></article>
    <aside class="col thumbcol" aria-labelledby="thh"><header><h2 id="thh">The position</h2></header>
      <div class="tbody"><div class="thumbbox" id="tbox" aria-hidden="true"><div class="stage thumb" id="tstage"></div></div>
        <p class="muted" style="margin:0;font-size:var(--text-sm)" id="tcap"></p>
        <a class="btn" id="study" href="11c-study.html#e05">Open in Study <kbd>↵</kbd></a>
        <p class="subtle" style="margin:0;font-size:12px">Opens the board at full game size with this explanation beside it.</p></div></aside>
  </div>
  <footer class="app-footer"></footer>
</div>
<script src="wf.js"></script>
<script src="cards.js"></script>
<script src="scenarios.js"></script>
<script src="expl.js"></script>
<script src="review-data.js"></script>
<script>
WF.chrome('Reviews');
const roomy = WF.isRoomy(); if (roomy) document.body.classList.add('roomy-h');
const STATES = [['e05', 'Severe flag (E05)'], ['mull', 'Mulligan flag (minor)'], ['e02', 'Hindsight flag (E02)'], ['e06', 'DON!! unused (E06)'], ['e19', 'Counter tied (E19)'], ['e09', 'Face over board (E09)'], ['unchecked', 'Not fully checked'], ['analysing', 'Still analysing']];
const tstage = document.getElementById('tstage');

function draw() {
  const st = WF.state() || 'e05';
  const sel = FLAGS[st] ? st : (st === 'analysing' ? 'e06' : null);
  const analysing = st === 'analysing';
  document.getElementById('title').innerHTML = `<h1>Game review</h1><span class="muted">Rocks.D.Xebec (you, second) vs Kaido · Pirate · <b style="color:var(--color-text)">Kaido wins, turn 13</b></span>
    <span style="flex:1"></span>${analysing ? '<span class="chip outline" role="status">Analysing turn 9 of 13 · finished turns are ready</span>' : '<span class="chip outline">5 flags · 1 severe</span><span class="chip outline">1 turn not fully checked</span>'}`;
  // Timeline: columns say whose turn each is; the opponent row says what it holds (UX-R30)
  const turns = Array.from({ length: 14 }, (_, i) => i);
  const mine = (t) => t === 0 || t % 2 === 0;
  const selTurn = sel ? FLAGS[sel].turn : (st === 'unchecked' ? 6 : -1);
  let h = '<div class="tl-grid"><span class="rl"></span>' + turns.map((t) => `<span class="h ${mine(t) ? 'mine' : ''} ${t === selTurn ? 'cur' : ''}">${t === 0 ? 'Mulligan' : `T${t} · ${mine(t) ? 'You' : 'Kaido'}`}</span>`).join('');
  const row = (who) => {
    let r = `<span class="rl">${who === 'me' ? 'Your decisions' : 'Kaido’s notable moves'}</span>`;
    turns.forEach((t) => {
      const hatched = analysing && t >= 9;
      let inner = '';
      if (who === 'me' && !hatched) {
        Object.entries(FLAGS).filter(([, f]) => f.turn === t).forEach(([k, f]) => {
          inner += `<a class="flag ${f.sev}" href="#${k}" ${k === sel ? 'aria-current="true"' : ''} aria-label="Turn ${t}${mine(t) ? ', your turn' : ', Kaido’s turn, your decision'}: ${f.name}, ${SEV[f.sev].toLowerCase()}" title="${f.name}">${SH[f.shape]}${f.sev === 'sev' ? '<span>Severe</span>' : ''}</a>`;
        });
        if (t === 6) inner += `<a class="flag min" href="#unchecked" ${st === 'unchecked' ? 'aria-current="true"' : ''} title="Not fully checked" aria-label="Turn 6, your turn: not fully checked" style="color:var(--color-warning-text)">${SH.dash}</a>`;
      }
      if (who === 'opp' && [5, 9, 13].includes(t) && !hatched) inner += `<a class="why-mk" href="09c-why.html" aria-label="Turn ${t}: why did Kaido do that?">Why?</a>`;
      const isSel = t === selTurn && who === 'me';
      r += `<div class="cell ${mine(t) ? 'mine' : ''} ${hatched ? 'hatch' : ''} ${isSel ? 'sel' : ''}">${inner}</div>`;
    });
    return r;
  };
  h += row('me') + row('opp') + '</div>';
  const me = [5, 5, 5, 5, 5, 4, 4, 4, 4, 3, 2, 2, 2, 0], kd = [5, 5, 5, 4, 4, 4, 4, 3, 3, 3, 2, 2, 0, 0];
  const W = 1000, H = 26;
  const pts = (a) => a.map((v, i) => `${(i + 0.5) / 14 * W},${H - 3 - v / 5 * (H - 6)}`).join(' ');
  h += `<div class="tl-grid" style="margin-top:2px"><span class="rl">Life</span><svg style="grid-column:2/16;width:100%;height:${H}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Life by turn. You: 5 down to 0 at turn 13. Kaido: 5 down to 0 at turn 12."><polyline points="${pts(me)}" fill="none" stroke="var(--color-accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${pts(kd)}" fill="none" stroke="var(--color-opponent)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/></svg></div>`;
  h += `<div class="legend"><span>${SH.triF} should have countered</span><span>${SH.triH} counter wasted</span><span>${SH.sqH} DON!! unused</span><span>${SH.cirH} attack ordering</span><span>${SH.eye} hindsight</span><span style="color:var(--color-warning-text)">${SH.dash} not fully checked</span><span>— you · - - Kaido</span><span>bigger shape = more severe</span></div>`;
  document.getElementById('tl').innerHTML = h;
  // Flag list: a keyboard target in its own right (learning-ui §4.2)
  document.getElementById('flist').innerHTML = ORDER.filter((k) => !(analysing && FLAGS[k].turn >= 9)).map((k) => { const f = FLAGS[k]; return `<li><a href="#${k}" ${k === sel ? 'aria-current="true"' : ''}><span class="ic" aria-hidden="true" style="width:20px">${SH[f.shape]}</span><span>${f.name}</span><span class="meta">${f.turn === 0 ? 'Mulligan' : `Turn ${f.turn} · ${mine(f.turn) ? 'your turn' : 'Kaido’s turn'}`} · <span class="${f.sev === 'sev' ? 'sevw' : ''}">${SEV[f.sev]}</span></span></a></li>`; }).join('')
    + `<li><a href="#unchecked" ${st === 'unchecked' ? 'aria-current="true"' : ''}><span class="ic" aria-hidden="true" style="width:20px;color:var(--color-warning-text)">${SH.dash}</span><span>Not fully checked</span><span class="meta">Turn 6 · your turn · no flag</span></a></li>`;
  document.querySelectorAll('.flist .ic svg').forEach((svg) => { svg.setAttribute('width', 16); svg.setAttribute('height', 16); });
  // Thumbnail: the restored position, text-free (shapes only)
  const box = document.getElementById('tbox');
  const tw = roomy ? 358 : 234; const k = tw / 960;
  box.style.width = tw + 'px'; box.style.height = Math.round(720 * k) + 'px';
  tstage.style.transform = `scale(${k})`;
  WF.renderBoard(tstage, BOARDS[st](), { density: 'compact', boardOnly: true });
  tstage.setAttribute('inert', '');
  const studyHref = `11c-study.html#${sel && FLAGS[sel].e ? sel : 'e05'}`;
  document.getElementById('study').setAttribute('href', st === 'unchecked' ? '11c-study.html#unchecked' : studyHref);
  // Detail: explanation with pinned actions
  const d = document.getElementById('detail');
  if (st === 'unchecked') {
    document.getElementById('tcap').textContent = 'Turn 6, start of your turn: the position the analysis could not finish.';
    d.innerHTML = `<header><h2>Turn 6 · your turn</h2></header><div class="rbody"><h2 class="claim" style="margin:0 0 6px">This turn wasn't fully checked.</h2><p>${EXPL.cert('search-incomplete', 'review')}</p>
      <p style="margin:6px 0">The analysis ran out of time on this turn. It found no proof either way, so no better line was computed. A turn that wasn't fully checked is never shown as clean.</p></div>
      <div class="dfoot2"><button class="btn primary" type="button">Analyse deeper</button><span class="subtle" style="font-size:12px;align-self:center">10× the time budget, with progress and Cancel</span></div>`;
    return;
  }
  if (st === 'mull') {
    document.getElementById('tcap').textContent = 'Turn 0: your opening hand, going second.';
    document.getElementById('study').setAttribute('href', '14b-mulligan.html#item');
    d.innerHTML = `<header><h2>Mulligan · going second · <b>Minor</b></h2></header><div class="rbody"><div class="wyd"><b>What you did.</b> Kept a hand whose cheapest Character costs 5.</div>
      <h2 class="claim" style="margin:0 0 6px">The guide would have redrawn this hand.</h2><p>${EXPL.cert('any-hand', 'guide')}</p>
      <p style="margin:6px 0">Going second you have 2, then 4 DON!!: nothing to play until turn 4 (your 2nd). A fresh five has a 1- to 3-cost Character 90% of the time. It is minor because you went second and drew into Stussy by turn 4.</p>
      <p class="lesson" style="margin:4px 0">Lesson: <a href="18-learn.html?l=L12-mulligan#lesson">Mulligan (L12)</a></p></div>
      <div class="dfoot2"><a class="btn primary" href="14b-mulligan.html#item">Practice mulligans</a></div>`;
    return;
  }
  const f = FLAGS[sel]; const e = EXPL.E[f.e];
  document.getElementById('tcap').textContent = `Turn ${f.turn}, ${mine(f.turn) ? 'your turn' : 'Kaido’s turn, your decision'}: the moment of the flag.`;
  const practise = f.e === 'E02' ? '<a class="btn" href="14-drill-lethal.html#real">Practice this <span class="subtle" style="font-weight:500">· their real hand</span></a>' : f.e === 'E05' || f.e === 'E19' ? '<a class="btn" href="14c-drill-counter.html">Practice this</a>' : '<a class="btn" href="14-drill-lethal.html">Practice this</a>';
  d.innerHTML = `<header><h2>Turn ${f.turn} · ${mine(f.turn) ? 'your turn' : 'Kaido’s turn, your decision'} · ${f.name} · <b>${SEV[f.sev]}</b></h2></header>
    <div class="rbody"><div class="wyd"><b>What you did.</b> ${f.what}</div>
    ${EXPL.render(e, { mode: 'review', verbosity: 'learner' }).replace('<h4 class="claim">', '<h2 class="claim" style="margin:0 0 6px">').replace('</h4>', '</h2>')}</div>
    <div class="dfoot2"><a class="btn primary" href="${studyHref}">Study this moment <kbd>↵</kbd></a>${practise}<a class="btn" href="03-main.html">Play from here</a></div>`;
  // the review region scrolls only when it must; then it is focusable
  WF.scrollCue(d.querySelector('.rbody')); // focusable and cued only when it scrolls (UX-V4)
}
draw();
window.addEventListener('hashchange', draw);
// Enter on the page (outside a control) opens Study, as on the flag list (accessibility §3.16)
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.target.closest('a, button, input')) location.href = document.getElementById('study').href; });
WF.statesBar(STATES);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board: game over</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="wf.css">
<style>
  /* Result banner over the midline band only; the final position stays readable (UX-R39) */
  .gobanner { position: absolute; z-index: 30; display: grid; place-items: center; background: var(--color-surface-3); border: 1px solid var(--color-opponent); border-radius: var(--radius-2); font: 600 var(--text-xl)/1 var(--font-display); color: var(--color-text); box-shadow: var(--elev-2); }
</style>
</head>
<body class="board-page">
<main class="stage" aria-label="Game over: Kaido wins on turn 13"></main>
<div id="announce-assertive" class="sr-only" role="alert">Game over. Kaido wins on turn 13.</div>
<script src="wf.js"></script>
<script src="cards.js"></script>
<script src="scenarios.js"></script>
<script>
const STATES = [['lose', 'Game over']];
WF.mountBoard((st) => {
  const opp = (id, x = {}) => K(id, { who: 'Opponent’s', ...x });
  const win = st === 'win';
  const s = {
    boardLabel: 'Game board, game over',
    opp: {
      idText: 'Kaido · Pirate AI', hand: win ? 2 : 0, donDeck: 0, active: 0, rested: 8, life: win ? 0 : 2, deck: 18,
      leader: opp('OP17-058', { r: true, don: 2, p: 7000 }),
      trash: { n: 17, top: K('OP17-077') },
      chars: [null, opp('OP17-060', { r: true }), opp('OP17-062', { r: true }), null, null],
    },
    me: {
      donDeck: 0, active: 4, rested: 6, life: 0, deck: 15,
      leader: K('OP17-039', { who: 'Your' }),
      trash: { n: 21, top: K('OP17-055') },
      chars: [null, null, null, null, null],
      hand: [K('OP17-045', { hand: true })],
    },
    mid: { turn: 'Turn 13 · Game over', phase: 'End' },
    log: [
      SCN.th('Turn 13 · Opp'),
      SCN.opp(`${SCN.lk('Ulti & Page One')} attacks your Leader · 6000 vs 5000`),
      SCN.you('No counter · Hit · your Life 1 → 0'),
      SCN.opp(`${SCN.lk('Kaido')} attacks your Leader · 7000 vs 5000`),
      SCN.you(`Counter: ${SCN.lk('Rocks Pirates')}, ${SCN.lk('Buckin')} · 5000 → 8000`),
      '<li>Attack fails</li>',
      SCN.opp(`${SCN.lk('Kaido')} (12000) attacks your Leader · 12000 vs 5000`),
      SCN.you(`Counter: ${SCN.lk('There’s No Authority…')} · 5000 → 7000`),
      '<li><b>Hit at 0 Life · Kaido wins</b></li>',
    ],
    coachStrip: {},
    // The result lives in the decision panel, its one home (UX-R39, P8); a 40 px banner sits over the midline only
    decision: {
      title: win ? 'Game over · you win' : 'Game over · Kaido wins', q: false,
      body: `<p style="margin:0 0 4px">${win ? 'Their Leader was hit at 0 Life.' : 'Your Leader was hit at 0 Life, by Kaido at 12000.'}</p>
        <p class="subtle" style="margin:0 0 6px">The review opens at once and fills in as analysis runs.</p>
        <div class="row" style="gap:6px;flex-wrap:wrap"><a class="btn small" href="02-setup.html">New game</a><a class="btn small" href="01-welcome.html">Home</a></div>`,
      foot: `<a class="btn big sec" href="02-setup.html#rps"><span class="lbl2">Rematch</span><span class="sub">same decks</span></a>${SCN.primary('Review game', '1 severe flag', 'Enter', '11b-review.html')}`,
    },
  };
  s.extra = (g) => {
    const m = g.mid;
    return `<div class="gobanner" role="status" style="left:${m[0]}px;top:${m[1] + (m[3] - 40) / 2}px;width:${m[2]}px;height:40px">${win ? 'You win' : 'Kaido wins'} · Turn 13</div>`;
  };
  return s;
}, STATES);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Sim · Reviews</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="wf.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; }
  .hist { width: 100%; border-collapse: collapse; }
  .hist th { text-align: left; font: 600 var(--text-xs)/var(--leading-xs) var(--font-ui); color: var(--color-text-muted); padding: 6px 10px; border-bottom: 1px solid var(--color-line-strong); }
  .hist td { padding: 10px; border-bottom: 1px solid var(--color-line); font-size: var(--text-md); vertical-align: middle; }
  .hist tr:hover td { background: var(--color-surface-1); }
  .res { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .res.w { color: var(--color-success-text); }
  .res.l { color: var(--color-danger-text); }
  .fl { display: inline-flex; gap: 10px; flex-wrap: wrap; font-size: var(--text-sm); }
  .fl span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .fl svg { flex: none; }
  .tag { font: 600 var(--text-xs)/var(--leading-xs) var(--font-ui); border: 1px solid var(--color-line-strong); border-radius: var(--radius-1); padding: 1px 6px; color: var(--color-text-muted); white-space: nowrap; }
  .tag.warn { border-style: dashed; color: var(--color-warning-text); border-color: var(--color-warning-text); }
  .empty { max-width: 560px; margin: 48px auto; text-align: center; }
  .empty h2 { font: 600 var(--text-3xl)/var(--leading-3xl) var(--font-display); margin: 12px 0 8px; }
  .empty p { color: var(--color-text-muted); font-size: var(--text-lg); line-height: var(--leading-lg); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header"></header>
  <main class="app-main" id="main" style="padding-top:16px"></main>
  <footer class="app-footer"></footer>
</div>
<script src="wf.js"></script>
<script>
WF.chrome('Reviews');
const STATES = [['list', 'History list'], ['empty', 'Empty: no games yet']];
const S = {
  sev: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l7 13H1z" fill="currentColor"/></svg>',
  mod: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6 11H2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  min: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="6" width="12" height="4" fill="currentColor"/></svg>',
  hind: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/></svg>',
};
const flags = (s, m, n, h) => {
  const bits = [];
  if (s) bits.push(`<span>${S.sev}<b>${s} severe</b></span>`);
  if (m) bits.push(`<span>${S.mod}${m} moderate</span>`);
  if (n) bits.push(`<span>${S.min}${n} minor</span>`);
  if (h) bits.push(`<span>${S.hind}${h} hindsight</span>`);
  return bits.length ? `<span class="fl">${bits.join('')}</span>` : '<span class="muted" style="font-size:var(--text-sm)">No flags</span>';
};
const ROWS = [
  ['l', 'Kaido · Pirate', 'Rocks.D.Xebec', 'Today, 14:20', 13, flags(1, 3, 1, 1), '<a class="btn small primary" href="11b-review.html#e05">Review</a>'],
  ['w', 'Kaido · Pirate', 'Rocks.D.Xebec', 'Today, 13:05', 11, flags(0, 1, 0, 0), '<a class="btn small" href="11b-review.html#e06">Review</a>'],
  ['w', 'Nico Robin · Pirate', 'Rocks.D.Xebec', 'Yesterday', 12, '<span class="tag warn">Analysis incomplete · 7 of 12 turns</span>', '<a class="btn small" href="11b-review.html#analysing">Resume analysis</a>'],
  ['l', 'Luffy (Black) · Warlord', 'Rocks.D.Xebec', '24 Oct', 9, flags(2, 1, 0, 0), '<a class="btn small" href="11b-review.html#e05">Review</a>'],
  ['w', 'Kaido · Rookie', 'Rocks.D.Xebec', '22 Oct', 10, flags(0, 0, 1, 0), '<a class="btn small" href="11b-review.html#e06">Review</a>'],
  ['l', 'Kaido · Pirate', 'Rocks.D.Xebec', '3 Oct', 14, '<span class="tag">Made with an older version: read-only</span>', '<a class="btn small" href="11b-review.html#e05" aria-label="Open read-only review, 3 October game">Open read-only</a>'],
];
function list() {
  return `<div class="wrap">
    <div class="row" style="align-items:end;margin-bottom:12px"><div><h1 class="page" style="margin:0">Reviews</h1><p class="muted" style="margin:2px 0 0">Every finished game, newest first. Each one is analysed on this device after the game.</p></div><span style="flex:1"></span>
      <label class="lbl" style="margin:0">Show <select class="input" style="width:auto;height:32px;display:inline-block;margin-left:4px"><option>All games</option><option>With severe flags</option><option>Wins</option><option>Losses</option></select></label></div>
    <table class="hist"><caption class="sr-only">Your games</caption><thead><tr><th scope="col">Result</th><th scope="col">Opponent and AI tier</th><th scope="col">Your deck</th><th scope="col">Played</th><th scope="col" style="text-align:right">Turns</th><th scope="col">Flags</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead>
      <tbody>${ROWS.map(([r, o, d, t, n, f, a]) => `<tr><td><span class="res ${r}">${r === 'w' ? '✓ Won' : '✕ Lost'}</span></td><td>${o}</td><td>${d}</td><td>${t}</td><td class="num" style="text-align:right">${n}</td><td>${f}</td><td style="text-align:right">${a}</td></tr>`).join('')}</tbody></table>
    <p class="muted" style="margin:14px 0 0;font-size:var(--text-sm)">6 games · stored only in this browser. <button class="btn small" type="button">Export reviews</button> Reviews older than a version change open read-only: the explanations stay, but "Play from here" is off.</p></div>`;
}
function empty() {
  return `<div class="empty"><svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true" fill="none" stroke="var(--color-accent)" stroke-width="3"><rect x="10" y="20" width="68" height="48" rx="6"/><path d="M20 56l12-14 10 8 12-16 14 10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>No games yet</h2><p>Play a game and its review appears here: a timeline of the game, the moments worth a second look, and why.</p>
    <div class="row" style="justify-content:center"><a class="btn primary big" href="02-setup.html"><span class="lbl2">Play a game</span><span class="sub">Rocks vs Kaido · Pirate</span></a><a class="btn big" href="15-tutorial.html"><span class="lbl2">Take the tutorial</span><span class="sub">about 20 minutes</span></a></div></div>`;
}
function draw() { const st = WF.state() || 'list'; document.getElementById('main').innerHTML = st === 'empty' ? empty() : list(); }
draw(); window.addEventListener('hashchange', draw); WF.statesBar(STATES);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Sim · Mulligan trainer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="wf.css">
<style>
  .hand { display: flex; gap: 14px; justify-content: center; margin: 18px 0 14px; }
  .hand .cb { position: relative; width: 112px; height: 156px; }
  .roomy-h .hand .cb { width: 150px; height: 209px; }
  .drill { display: grid; grid-template-columns: 1fr 420px; gap: 20px; align-items: start; }
  .start { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ans .claim { font-size: var(--text-xl); line-height: var(--leading-xl); }
  .ans-btn { min-width: 180px; }
  .handlist:focus-visible { outline-offset: 6px; border-radius: 8px; }
  .cert.guide { border-color: var(--color-accent-text); color: var(--color-accent-text); }
</style>
</head>
<body>
<div class="app">
  <header class="app-header"></header>
  <main class="app-main" id="main" style="padding-top:16px"></main>
  <footer class="app-footer"></footer>
</div>
<script src="wf.js"></script>
<script src="cards.js"></script>
<script src="expl.js"></script>
<script>
WF.chrome('Drills');
const roomy = WF.isRoomy(); if (roomy) document.body.classList.add('roomy-h');
// E11 with game-turn wording (one rule: game turn numbers, "(your Nth)" where it matters) and the guide's certainty label.
const E11 = { ...EXPL.E.E11,
  evidence: ['Your cheapest Character costs 5. Going first you have 1, 3, then 5 DON!!: nothing to play until turn 5 (your 3rd).', ...EXPL.E.E11.evidence.slice(1)],
  outcome: 'A 90% chance of a play on turn 1, 3 or 5 (your first three turns), instead of none until turn 5.' };
const GUIDE_CERT = '<span class="cert guide" title="This answer comes from the Rocks.D.Xebec guide\u2019s mulligan section, which cites its source. No opponent hand is involved."><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h7l3 3v9H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8h5M5.5 11h5" stroke="currentColor" stroke-width="1.4"/></svg>From the Rocks guide (sourced)</span>';
function renderAnswer() { return EXPL.render(E11, { verbosity: 'learner' }).replace(/<span class="cert [^"]*"[^>]*>[\s\S]*?<\/span>/, GUIDE_CERT); }
const STATES = [['start', 'Start screen'], ['item', 'Item: keep or redraw'], ['answer', 'Answer (E11)']];
function draw() {
  const st = WF.state() || 'start';
  const m = document.getElementById('main');
  const cw = roomy ? 150 : 112, ch = Math.round(cw * 88 / 63);
  const hand = ['OP17-118', 'OP17-048', 'OP17-040', 'OP17-049', 'OP17-056'].map((id) => `<div class="cb" role="listitem" style="--card-w:${cw}px;--badge-power-size:${roomy ? 20 : 16}px;--badge-num-size:${roomy ? 17 : 14}px;--badge-h:${roomy ? 28 : 24}px">${WF.cardHTML(K(id, { hand: true }), [0, 0, cw, ch], { card: [cw, ch] })}</div>`).join('');
  const head = `<div class="row" style="align-items:end"><div><p class="muted" style="margin:0">Drills · Lesson L12 Mulligan</p><h1 class="page" style="margin:0">Mulligan trainer</h1></div><span style="flex:1"></span>${st === 'start' ? '' : '<span class="chip outline">Item 3 of 10</span><span class="chip outline">Untimed</span>'}</div>`;
  if (st === 'start') {
    m.innerHTML = head + `<p class="lede" style="margin-top:8px">You see an opening hand, your seat and the matchup. Keep or redraw. The answer comes from the archetype guide, with its reasons.</p>
      <div class="start">
        <div class="panel"><label class="lbl" for="arch">Archetype</label><select class="input" id="arch"><option>Rocks.D.Xebec (OP17-039)</option><option>Kaido (OP17-058)</option></select>
          <div class="lbl" style="margin-top:10px">Seat</div><div class="seg" role="radiogroup" aria-label="Seat"><button type="button" role="radio" aria-checked="true">Both</button><button type="button" role="radio" aria-checked="false">First</button><button type="button" role="radio" aria-checked="false">Second</button></div></div>
        <div class="panel"><div class="lbl">Source</div><div class="seg" role="radiogroup" aria-label="Source"><button type="button" role="radio" aria-checked="true">Bank</button><button type="button" role="radio" aria-checked="false">From my games</button></div>
          <div class="lbl" style="margin-top:10px">Items</div><div class="seg" role="radiogroup" aria-label="Items"><button type="button" role="radio" aria-checked="false">5</button><button type="button" role="radio" aria-checked="true">10</button><button type="button" role="radio" aria-checked="false">20</button></div></div>
        <div class="panel"><div class="lbl" id="tm">Time allowed</div><div class="seg" role="radiogroup" aria-labelledby="tm" style="flex-wrap:wrap">${['Untimed', '50%', '100%', '200%', '400%', '1000%'].map((v, i) => `<button type="button" role="radio" aria-checked="${i === 0}">${v}</button>`).join('')}</div>
          <p class="muted" style="font-size:13px;margin:8px 0 0">Untimed by default. A timer can be paused and never ends an item; passing is judged untimed. Base time: 30 s a hand.</p></div>
      </div>
      <div class="row" style="margin-top:16px"><a class="btn primary big" href="#item" data-wf-focus><span class="lbl2">Start 10 hands <kbd>Enter</kbd></span></a><span class="muted">Your best so far: 7 of 10 · pass mark 8 of 10</span></div>`;
  } else {
    const ans = st === 'answer';
    m.innerHTML = head + `<div class="drill"><section aria-label="Your opening hand">
      <p style="margin:8px 0 0;font-size:var(--text-lg)"><b>You play Rocks.D.Xebec, going first</b> <span class="muted">against Kaido</span></p>
      <div class="hand handlist" role="list" tabindex="-1" id="handlist" aria-label="Your opening hand: Rocks.D.Xebec (cost 10), Shiki (cost 7), Edward.Newgate (cost 9), Charlotte Linlin (cost 5), Rocks Pirates (Event, Counter +2000). Keep or redraw?">${hand}</div>
      ${ans ? '' : `<div class="row" style="justify-content:center" role="group" aria-label="Your answer"><button class="btn big ans-btn" type="button"><span class="lbl2">Keep <kbd>K</kbd></span><span class="sub">play these five</span></button><button class="btn big ans-btn" type="button"><span class="lbl2">Redraw <kbd>R</kbd></span><span class="sub">five new cards</span></button></div>
      <p class="subtle" style="text-align:center;margin:10px 0 0">Ask yourself: can I play something on each of my first two turns? Do I hold a piece of my plan? Can I defend?</p>`}</section>
      <aside class="panel ans" aria-label="Answer">${ans ? `<p style="margin:0 0 6px"><span class="chip success">✓ Correct: redraw</span></p>` + renderAnswer() + `<div class="row" style="margin-top:8px"><a class="btn primary" href="#item" data-wf-focus>Next hand <kbd>Enter</kbd></a></div>` : '<p class="muted" style="margin:0">The answer appears here after you choose. Hints are off in drills; "Show answer" counts the item as missed.</p><button class="btn small" type="button" style="margin-top:8px">Show answer</button>'}</aside></div>`;
  }
  const f = document.querySelector('[data-wf-focus]') || (st === 'item' ? document.getElementById('handlist') : null); if (f) f.focus();
}
draw(); window.addEventListener('hashchange', draw); WF.statesBar(STATES);
</script>
</body>
</html>

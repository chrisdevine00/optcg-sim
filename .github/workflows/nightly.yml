name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  # Review M5b-4: this job now also runs the Pirate game-plan tallies (groups 1 to 3, with and
  # without the biases) and four nightly Playwright specs on top of the property run that took 15
  # to 30 minutes before M5b. Estimate: property 30, Pirate series and tallies about 25, Playwright
  # about 25, bench 5: about 85 minutes, so a 150-minute cap. Calibrate it from the first dispatch.
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 10,000 random legal games with meta decks, plus golden records (PLAN §5, §8).
      # Each run draws a new PROPERTY_SEED and logs it; rerun with PROPERTY_SEED=<seed> to reproduce.
      - run: npm run test:nightly
      # The full unit suite, including every card's tests (per push only changed cards run; M6b-0).
      - run: npm test
        if: always()
      # M5a strength (ADR 0008; review M5a-10): Pirate vs Rookie over 200 iteration-budgeted games
      # (at least 95%), vs a shallow Pirate over 100 (at least 60%), a non-prior-list row, the
      # shallow control and A/B runs, and the game-plan assertions over 40 Pirate-vs-Pirate games
      # with and without the biases (group 3: ai/test/game-plan-g3.test.ts, game-plan-g3-40.json). Reports: test-results/strength-*.json, game-plan-40.json.
      - run: npm run test:strength:pirate
        if: always()
      # M5b group-1 playbooks (Robin, Yellow Enel, Kalgara, Hancock): the game-plan assertions over
      # 64 Pirate-vs-Pirate games among the four decks, with and without the biases.
      # Report: test-results/game-plan-g1-64.json.
      - run: npm run test:plan-g1
        if: always()
      # Full games from turn 1 through the UI (vs Rookie, hotseat, keyboard only, and AI turn pacing
      # at 1× vs Pirate): too slow per push.
      - run: npx playwright install --with-deps chromium
        if: always()
      - run: npx playwright test app/e2e/game.spec.ts app/e2e/keyboard.spec.ts app/e2e/pirate.spec.ts app/e2e/warlord.spec.ts
        if: always()
        env:
          E2E_FULL: '1'
      - run: npm run bench -- --outputJson test-results/bench.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: test-results/
  # M5b strength (ADR 0008; review M5a-10, M5b-4): 200 iteration-budgeted games per series over
  # twelve ordered deck pairs (all twelve archetypes), each seat in turn. Pirate vs Rookie at least
  # 75%, Warlord vs Rookie at least 95%, Warlord vs Pirate at least 65%, Warlord vs a one-iteration
  # Warlord at least 70% (and that Warlord under 65% against Pirate), plus Emperor vs Warlord.
  # One job per series so none needs the sum of them. Times measured on the hosted runner by the
  # first nightly (run 44074243109, 200 games each): Pirate vs Rookie 5 min, Warlord vs Rookie
  # about 126, Warlord vs Pirate about 123, the two controls about 142 together. Per-test timeouts
  # in ai/test/strength-warlord.test.ts are 2.5x those; every job gets the hosted maximum, 360.
  # Reports: test-results/m5b-*.json (each prints its Wilson interval).
  strength-m5b:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        series:
          - { name: pirate-vs-rookie, filter: 'Pirate beats Rookie', extra: '0' }
          - { name: warlord-vs-rookie, filter: 'Warlord beats Rookie', extra: '0' }
          - { name: warlord-vs-pirate, filter: 'Warlord beats Pirate', extra: '0' }
          - { name: control-full, filter: 'beats a one-iteration', extra: '0' }
          - { name: control-tiny, filter: 'fails the Pirate gate', extra: '0' }
          - { name: emperor, filter: 'Emperor', extra: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run ai/test/strength-warlord.test.ts -t "${{ matrix.series.filter }}"
        env:
          STRENGTH_GAMES: '200'
          EXTRA: ${{ matrix.series.extra }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strength-m5b-${{ matrix.series.name }}
          path: test-results/
  # The Warlord's own game-plan tallies (review M5b-1): the group assertions over Warlord-vs-Warlord
  # games, biases on (40 games for Rocks/Kaido and groups 2 and 3, 64 for group 1). About 25 s a
  # game on a laptop: 17 to 27 minutes nominal per file, so four jobs with a 150-minute cap.
  # Reports: test-results/game-plan*-warlord.json.
  plan-warlord:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        file: [strength, game-plan-g1, game-plan-g2, game-plan-g3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run ai/test/${{ matrix.file }}.test.ts -t 'game-plan assertions|game plans'
        env:
          PLAN_TIER: warlord
          PLAN_GAMES: '40'
          PLAN_GAMES_G1: '64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-warlord-${{ matrix.file }}
          path: test-results/

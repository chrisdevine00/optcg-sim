name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 10,000 random legal games with meta decks, plus golden records (PLAN §5, §8).
      # Each run draws a new PROPERTY_SEED and logs it; rerun with PROPERTY_SEED=<seed> to reproduce.
      - run: npm run test:nightly
      # M5a strength (ADR 0008; review M5a-10): Pirate vs Rookie over 200 iteration-budgeted games
      # (at least 95%), vs a shallow Pirate over 100 (at least 60%), a non-prior-list row, the
      # shallow control and A/B runs, and the game-plan assertions over 40 Pirate-vs-Pirate games
      # with and without the biases. Reports: test-results/strength-*.json, game-plan-40.json.
      - run: npm run test:strength
        if: always()
      # Full games from turn 1 through the UI (vs Rookie, hotseat, keyboard only, and AI turn pacing
      # at 1× vs Pirate): too slow per push.
      - run: npx playwright install --with-deps chromium
        if: always()
      - run: npx playwright test app/e2e/game.spec.ts app/e2e/keyboard.spec.ts app/e2e/pirate.spec.ts
        if: always()
        env:
          E2E_FULL: '1'
      - run: npm run bench -- --outputJson test-results/bench.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: test-results/

name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 10,000 random legal games with meta decks, plus golden records (PLAN §5, §8).
      - run: npm run test:nightly
      - run: npm run bench -- --outputJson test-results/bench.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: test-results/
